<!DOCTYPE html>

<body class="pb-24">

          </h1>
          <div class="flex items-center gap-1 text-[11px] text-amber-600 font-medium">

          </div>

        </button>
      </div>
    </header>

        <button onclick="setTab('plan')" id="nav-plan" class="flex flex-col items-center justify-center py-1 rounded-xl text-[#2d3748] font-bold">
          <span class="text-lg leading-none mb-1">📍</span>
          <span class="text-[11px]">แพลนเที่ยว</span>
        </button>
        <button onclick="setTab('expense')" id="nav-expense" class="flex flex-col items-center justify-center py-1 rounded-xl text-slate-400">

          <span class="text-[11px]">ค่าใช้จ่าย</span>
        </button>
        <button onclick="setTab('members')" id="nav-members" class="flex flex-col items-center justify-center py-1 rounded-xl text-slate-400">

          <span class="text-[11px]">เพื่อนทริป</span>
        </button>
        <button onclick="setTab('chat')" id="nav-chat" class="flex flex-col items-center justify-center py-1 rounded-xl text-slate-400 relative">

          <span class="text-[11px]">แชทกลุ่ม</span>

            <option value="🎫 ค่าเข้า/กิจกรรม">🎫 ค่าเข้า/กิจกรรม</option>

            { id: 'i3_3', time: '13:00 - 15:30', category: '🏞️ ที่เที่ยว', title: 'พระธาตุหลวง & ประตูชัย & คาเฟ่เวียงจันทน์', cost: 60000, currency: 'LAK', splitType: 'per_person', payer: 'Kanyarat', note: 'ค่าเข้าด้านในจุดละ ~30,000 กีบ | แวะ Joma Bakery ซื้อของฝาก', mapQuery: 'Pha That Luang Vientiane', bookingUrl: '', photo: '' },
            { id: 'i3_4', time: '15:30 - 19:20', category: '🚗 เดินทาง', title: 'ข้ามด่านหนองคาย -> สนามบินอุดรธานี', cost: 50, currency: 'THB', splitType: 'per_person', payer: 'Kanyarat', note: '18:30 ถึงสนามบินอุดรฯ | 19:20 ขึ้นเครื่องกลับโดยสวัสดิภาพ', mapQuery: 'Udon Thani International Airport', bookingUrl: '', photo: '' }
          ]
        }
      ]
    };

    let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    let currentTab = 'plan';
    let activeUserId = localStorage.getItem('sabai_active_user') || 'm1';
    let tempModalPhoto = '';
    let saveTimer = null;

    async function init() {
      if (sb) {
        setSyncText('กำลังซิงก์...', false);
        const { data } = await sb.from('trip_plans').select('data').eq('id', TRIP_ID).single();
        if (data && data.data) {
          state = data.data;
        } else {
          await sb.from('trip_plans').upsert({ id: TRIP_ID, data: state });
        }
        setSyncText('ซิงก์เรียลไทม์', true);

        sb.channel('sabai-realtime')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'trip_plans', filter: `id=eq.${TRIP_ID}` }, payload => {
            if (payload.new && payload.new.data) {
              state = payload.new.data;
              renderApp();
              setSyncText('อัปเดตล่าสุดแล้ว', true);
            }
          })
          .subscribe();
      } else {
        const saved = localStorage.getItem('sabai_mobile_offline');
        if (saved) state = JSON.parse(saved);
        setSyncText('โหมดออฟไลน์', false);
      }
      renderApp();
    }

    function setSyncText(txt, ok) {
      const el = document.getElementById('syncBadge');
      el.innerText = txt;
      el.className = ok ? 'text-emerald-600 font-medium' : 'text-amber-600 font-medium';
    }

    function saveState() {
      clearTimeout(saveTimer);
      setSyncText('กำลังบันทึก...', false);
      saveTimer = setTimeout(async () => {
        if (sb) {
          await sb.from('trip_plans').upsert({ id: TRIP_ID, data: state, updated_at: new Date().toISOString() });
          setSyncText('ซิงก์เรียลไทม์', true);
        } else {
          localStorage.setItem('sabai_mobile_offline', JSON.stringify(state));
          setSyncText('บันทึกในเครื่องแล้ว', false);
        }
      }, 350);
    }

    function getActiveUser() {
      return state.members.find(m => m.id === activeUserId) || state.members[0];
    }

    function renderHeader() {
      document.getElementById('headerTripTitle').innerText = state.tripName;
      const u = getActiveUser();
      document.getElementById('activeUserName').innerText = u.name;
      const avEl = document.getElementById('activeUserAvatar');
      if (u.avatarUrl) {
        avEl.innerHTML = `<img src="${u.avatarUrl}" class="w-full h-full object-cover" />`;
      } else {
        avEl.innerText = u.emoji || u.name.charAt(0).toUpperCase();
      }
    }

    function setTab(tab) {
      currentTab = tab;
      ['plan', 'expense', 'members', 'chat'].forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (t === tab) {
          btn.className = 'flex flex-col items-center justify-center py-1 rounded-xl text-[#1e293b] font-bold bg-slate-100/80';
        } else {
          btn.className = 'flex flex-col items-center justify-center py-1 rounded-xl text-slate-400';
        }
      });
      renderApp();
    }

    function renderApp() {
      renderHeader();
      const container = document.getElementById('appContent');
      if (currentTab === 'plan') container.innerHTML = renderPlanTab();
      else if (currentTab === 'expense') container.innerHTML = renderExpenseTab();
      else if (currentTab === 'members') container.innerHTML = renderMembersTab();
      else if (currentTab === 'chat') {
        container.innerHTML = renderChatTab();
        const box = document.getElementById('chatScrollBox');
        if (box) box.scrollTop = box.scrollHeight;
      }
    }

    // ==================== TAB 1: แพลนเที่ยว ====================
    function renderPlanTab() {
      const day = state.days[state.activeDayIdx] || state.days[0];

              ${d.label}
            </button>
          `).join('')}
          <button onclick="addNewDay()" class="px-4 py-2 rounded-2xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 shrink-0">

                ${item.photo ? `
                  <div class="rounded-2xl overflow-hidden border border-slate-100">
                    <img src="${item.photo}" class="w-full h-44 object-cover" />

                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100 space-y-2 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="text-slate-500">💰 ค่าใช้จ่าย</span>
                    <span class="font-bold text-sm text-slate-800">${costFormatted} ${unitLabel}</span>
                    <span class="text-[11px] px-2 py-0.5 rounded-full ${item.splitType === 'shared' ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700'}">
                      ${item.splitType === 'shared' ? 'หารร่วมกัน' : 'จ่ายต่อคน'}
                    </span>

                  <div class="flex items-center justify-between pt-1.5 border-t border-slate-200/60">

                      <span class="w-4 h-4 rounded-full bg-orange-500 text-white text-[10px] flex items-center justify-center">${(item.payer || 'K').charAt(0)}</span>
                      ${item.payer || 'Kanyarat'}
                    </span>
                  </div>
                </div>

                ${item.note ? `
                  <div class="bg-slate-50/70 rounded-xl px-3 py-2 text-xs text-slate-600 border border-slate-100">

                <!-- Action Pills: Google Maps + Booking/Website Link -->
                <div class="pt-0.5 flex flex-wrap items-center justify-between gap-2">
                  <div class="flex flex-wrap items-center gap-1.5">

                        <span>${isHotel ? '🏨 จองที่พัก / ดูห้อง' : '🔗 เปิดลิงก์เว็บ'}</span> ↗
                      </a>

                      <a href="${autoSearchHotelUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 bg-cyan-50 hover:bg-cyan-100 text-cyan-800 border border-cyan-200 text-xs font-semibold px-3 py-2 rounded-full transition">
                        <span>🏨 ค้นหาที่พักนี้</span> ↗
                      </a>

                  <label class="text-[11px] text-slate-400 hover:text-slate-600 cursor-pointer ml-auto">
                    📷 ${item.photo ? 'เปลี่ยนรูป' : '+ รูป'}

    // ==================== TAB 2: ค่าใช้จ่าย ====================
    function renderExpenseTab() {
      const rate = Number(state.exchangeRate) || 650;
      const memberCount = Math.max(1, state.members.length);

      let totalThb = 0;
      let perPersonShareThb = 0;
      const catTotals = {};

      state.days.forEach(d => {
        d.items.forEach(item => {
          const raw = Number(item.cost) || 0;
          const thb = item.currency === 'LAK' ? (raw / rate) : raw;
          totalThb += thb;
          perPersonShareThb += (item.splitType === 'shared') ? (thb / memberCount) : thb;
          catTotals[item.category] = (catTotals[item.category] || 0) + thb;
        });
      });

      const totalLak = Math.round(totalThb * rate);
      const fundTotal = state.centralFund.reduce((s, f) => s + (Number(f.amount) || 0), 0);
      const fundRemaining = fundTotal - totalThb;
      const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

      return `
        <div class="bg-[#334155] text-white rounded-3xl p-5 shadow-md space-y-4">
          <div>
            <div class="text-xs text-slate-300">ยอดใช้จ่ายรวมทั้งทริป</div>
            <div class="text-3xl font-bold mt-1">฿${Math.round(totalThb).toLocaleString()}</div>
            <div class="text-xs text-slate-300 mt-0.5">≈ ${totalLak.toLocaleString()} กีบ (LAK)  |  เฉลี่ย ฿${Math.round(perPersonShareThb).toLocaleString()}/คน</div>
          </div>

          <div class="pt-3 border-t border-white/10 flex items-center justify-between text-xs">
            <span class="text-slate-300">อัตราแลกเปลี่ยน: 1 บาท =</span>
            <div class="flex items-center gap-1.5 bg-white/15 px-3 py-1.5 rounded-full">
              <input type="number" value="${rate}" onchange="updateRate(this.value)" class="w-14 bg-transparent text-right font-bold text-white outline-none" />
              <span>กีบ</span>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h3 class="font-bold text-sm text-slate-800">🐷 เงินกองกลางทริป (Central Fund)</h3>
              <p class="text-[11px] text-slate-400">บันทึกยอดลงขันกองกลางของกลุ่ม</p>
            </div>
            <button onclick="addCentralFund()" class="bg-[#334155] text-white text-xs font-semibold px-3.5 py-2 rounded-2xl shrink-0">
              + เพิ่มเงินกองกลาง
            </button>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
              <div class="text-[10px] text-slate-400">ยอดตั้งต้นรวม</div>
              <div class="font-bold text-sm text-slate-800 mt-0.5">฿${Math.round(fundTotal).toLocaleString()}</div>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
              <div class="text-[10px] text-slate-400">ใช้จ่ายไปแล้ว</div>
              <div class="font-bold text-sm text-amber-600 mt-0.5">฿${Math.round(totalThb).toLocaleString()}</div>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
              <div class="text-[10px] text-slate-400">คงเหลือปัจจุบัน</div>
              <div class="font-bold text-sm ${fundRemaining >= 0 ? 'text-emerald-600' : 'text-rose-600'} mt-0.5">฿${Math.round(fundRemaining).toLocaleString()}</div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
          <h3 class="font-bold text-sm text-slate-800">📊 สรุปค่าใช้จ่ายแยกตามหมวดหมู่</h3>
          <div class="space-y-3">
            ${sortedCats.map(([cat, val]) => {
              const pct = totalThb > 0 ? Math.round((val / totalThb) * 100) : 0;
              return `
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 space-y-1.5">
                  <div class="flex items-center justify-between text-xs font-semibold">
                    <span>${cat} <span class="text-slate-400 font-normal">(${pct}%)</span></span>
                    <span class="text-slate-800">฿${Math.round(val).toLocaleString()}</span>
                  </div>
                  <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                    <div class="h-full bg-amber-500 rounded-full" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-base text-slate-800">📝 Note & สิ่งที่ต้องเตรียม</h3>
            <button onclick="saveNoteText()" class="bg-[#334155] text-white text-xs font-semibold px-4 py-2 rounded-2xl">
              บันทึกโน้ต
            </button>
          </div>
          <textarea id="tripNoteInput" rows="7" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-xs leading-relaxed text-slate-700 outline-none focus:border-[#334155]">${state.notes}</textarea>
        </div>
      `;
    }

    // ==================== TAB 4: แชทกลุ่ม ====================
    function renderChatTab() {
      const me = getActiveUser();
      return `
        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="text-xl">💬</span>
            <div>
              <h2 class="font-bold text-sm text-slate-800">แชทกลุ่มทริปลาว</h2>
              <p class="text-[11px] text-slate-400">สมาชิก ${state.members.length}/10 คน</p>
            </div>
          </div>
          <span class="text-[11px] text-emerald-600 font-medium">☁️ ซิงก์เรียลไทม์</span>
        </div>

        <div id="chatScrollBox" class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm h-[52vh] overflow-y-auto space-y-3">
          ${state.messages.map(msg => {
            const sender = state.members.find(m => m.id === msg.senderId) || state.members[0];
            const isMe = sender.id === me.id;
            return `
              <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                <span class="text-[10px] text-slate-400 mb-1 px-1">${sender.name} • ${msg.time}</span>
                <div class="flex items-end gap-2 max-w-[82%] ${isMe ? 'flex-row-reverse' : ''}">
                  <div class="w-7 h-7 rounded-full bg-orange-500 text-white text-xs flex items-center justify-center shrink-0 overflow-hidden">
                    ${sender.avatarUrl ? `<img src="${sender.avatarUrl}" class="w-full h-full object-cover" />` : (sender.emoji || sender.name.charAt(0))}
                  </div>
                  <div class="px-3.5 py-2.5 rounded-2xl text-xs leading-relaxed ${isMe ? 'bg-[#334155] text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm'}">
                    ${msg.text}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="flex items-center gap-2">
          <div class="bg-white border border-slate-200 rounded-2xl px-2.5 py-2 text-xs font-semibold text-slate-700 shrink-0">
            ${me.emoji || '🐰'} ${me.name.slice(0, 7)}
          </div>
          <input id="chatInput" type="text" placeholder="พิมพ์ข้อความคุยกันในทริป..." onkeypress="if(event.key==='Enter') sendChat()"
            class="flex-1 bg-white border border-slate-200 rounded-2xl px-3.5 py-2.5 text-xs outline-none focus:border-[#334155]" />
          <button onclick="sendChat()" class="bg-[#334155] text-white w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 shadow-sm">
            ➤
          </button>
        </div>
      `;
    }

    // ==================== ACTIONS ====================
    function selectDay(idx) { state.activeDayIdx = idx; renderApp(); }
    function addNewDay() {
      const n = state.days.length + 1;
      state.days.push({ id: 'd' + Date.now(), label: `Day ${n}`, route: 'ระบุเส้นทางเดินทาง', items: [] });
      state.activeDayIdx = state.days.length - 1;
      renderApp(); saveState();
    }
    function editDayRoute() {
      const d = state.days[state.activeDayIdx];
      const r = prompt('แก้ไขเส้นทางของวันนี้:', d.route);
      if (r !== null) { d.route = r; renderApp(); saveState(); }
    }
    function editTripName() {
      const n = prompt('แก้ไขชื่อทริป:', state.tripName);
      if (n !== null && n.trim()) { state.tripName = n.trim(); renderApp(); saveState(); }
    }

    function openPlanModal(idx) {
      document.getElementById('editItemIdx').value = idx;
      const payerSel = document.getElementById('mPayer');
      payerSel.innerHTML = state.members.map(m => `<option value="${m.name}">${m.name}</option>`).join('');

      if (idx >= 0) {
        const item = state.days[state.activeDayIdx].items[idx];
        document.getElementById('modalTitle').innerText = '✏️ แก้ไขแพลน / ที่พัก';
        document.getElementById('mTime').value = item.time;
        document.getElementById('mCategory').value = item.category;
        document.getElementById('mTitle').value = item.title;
        document.getElementById('mBookingUrl').value = item.bookingUrl || '';
        document.getElementById('mCost').value = item.cost;
        document.getElementById('mCurrency').value = item.currency;
        document.getElementById('mSplitType').value = item.splitType;
        document.getElementById('mPayer').value = item.payer || state.members[0].name;
        document.getElementById('mMapQuery').value = item.mapQuery || '';
        document.getElementById('mNote').value = item.note || '';
        tempModalPhoto = item.photo || '';
      } else {
        document.getElementById('modalTitle').innerText = '+ เพิ่มแพลนเที่ยว / ที่พัก';
        document.getElementById('mTime').value = '14:00 - 15:00';
        document.getElementById('mCategory').value = '🏨 ที่พัก';
        document.getElementById('mTitle').value = '';
        document.getElementById('mBookingUrl').value = '';
        document.getElementById('mCost').value = '';
        document.getElementById('mCurrency').value = 'THB';
        document.getElementById('mSplitType').value = 'per_person';
        document.getElementById('mPayer').value = getActiveUser().name;
        document.getElementById('mMapQuery').value = '';
        document.getElementById('mNote').value = '';
        tempModalPhoto = '';
      }
      updateModalPreview();
      document.getElementById('planModal').classList.remove('hidden');
    }

    function closePlanModal() { document.getElementById('planModal').classList.add('hidden'); }

    function handleModalPhoto(input) {
      compressImage(input.files[0], url => { tempModalPhoto = url; updateModalPreview(); });
    }
    function clearModalPhoto() { tempModalPhoto = ''; updateModalPreview(); }
    function updateModalPreview() {
      const img = document.getElementById('mPhotoPreview');
      if (tempModalPhoto) { img.src = tempModalPhoto; img.classList.remove('hidden'); }
      else { img.classList.add('hidden'); }
    }

    function savePlanItem() {
      const idx = Number(document.getElementById('editItemIdx').value);
      const title = document.getElementById('mTitle').value.trim();
      if (!title) return alert('กรุณากรอกชื่อสถานที่หรือที่พักครับ');

      const obj = {
        id: 'i' + Date.now(),
        time: document.getElementById('mTime').value.trim() || 'เวลา',
        category: document.getElementById('mCategory').value,
        title,
        bookingUrl: document.getElementById('mBookingUrl').value.trim(),
        cost: Number(document.getElementById('mCost').value) || 0,
        currency: document.getElementById('mCurrency').value,
        splitType: document.getElementById('mSplitType').value,
        payer: document.getElementById('mPayer').value,
        mapQuery: document.getElementById('mMapQuery').value.trim() || title,
        note: document.getElementById('mNote').value.trim(),
        photo: tempModalPhoto
      };

      if (idx >= 0) state.days[state.activeDayIdx].items[idx] = obj;
      else state.days[state.activeDayIdx].items.push(obj);

      closePlanModal();
      renderApp(); saveState();
    }

    function deletePlanItem(idx) {
      if (confirm('ลบรายการนี้ใช่หรือไม่?')) {
        state.days[state.activeDayIdx].items.splice(idx, 1);
        renderApp(); saveState();
      }
    }

    function quickAttachPhoto(idx, input) {
      compressImage(input.files[0], url => {
        state.days[state.activeDayIdx].items[idx].photo = url;
        renderApp(); saveState();
      });
    }

    function updateRate(val) { state.exchangeRate = Math.max(1, Number(val) || 650); renderApp(); saveState(); }
    function addCentralFund() {
      const amt = prompt('ระบุจำนวนเงินที่ลงกองกลางเพิ่ม (บาท):', '1000');
      if (amt && !isNaN(amt)) {
        state.centralFund.push({ id: 'cf' + Date.now(), by: getActiveUser().name, amount: Number(amt), note: 'เพิ่มเงินกองกลาง' });
        renderApp(); saveState();
      }
    }

    function addMember() {
      if (state.members.length >= 10) return alert('ครบจำนวนสูงสุด 10 คนแล้วครับ');
      const name = document.getElementById('newMemberName').value.trim();
      const emoji = document.getElementById('newMemberEmoji').value;
      if (!name) return alert('กรุณาพิมพ์ชื่อเล่นเพื่อนก่อนครับ');
      state.members.push({ id: 'm' + Date.now(), name, role: 'สมาชิก', emoji, avatarUrl: '' });
      renderApp(); saveState();
    }
    function removeMember(idx) {
      if (confirm('ลบสมาชิกคนนี้ออกจากทริปใช่หรือไม่?')) {
        state.members.splice(idx, 1);
        renderApp(); saveState();
      }
    }
    function selectAsMe(id) {
      activeUserId = id;
      localStorage.setItem('sabai_active_user', id);
      renderApp();
    }
    function switchUserPrompt() { setTab('members'); }
    function uploadMemberAvatar(idx, input) {
      compressImage(input.files[0], url => { state.members[idx].avatarUrl = url; renderApp(); saveState(); }, 250);
    }
    function saveNoteText() {
      state.notes = document.getElementById('tripNoteInput').value;
      saveState();
      alert('บันทึกโน้ตเรียบร้อยแล้วครับ');
    }

    function sendChat() {
      const inp = document.getElementById('chatInput');
      const text = inp.value.trim();
      if (!text) return;
      const now = new Date();
      const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      state.messages.push({ id: 'msg' + Date.now(), senderId: getActiveUser().id, text, time });
      inp.value = '';
      renderApp(); saveState();
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('คัดลอกลิงก์เว็บเรียบร้อยแล้ว! ส่งเข้ากลุ่มไลน์ให้เพื่อนเปิดใช้งานร่วมกันได้เลยครับ');
    }

    function openToolModal() { document.getElementById('toolModal').classList.remove('hidden'); }
    function closeToolModal() { document.getElementById('toolModal').classList.add('hidden'); }

    async function calcDistanceTool() {
      const from = document.getElementById('tFrom').value.trim();
      const to = document.getElementById('tTo').value.trim();
      const btn = document.getElementById('tCalcBtn');
      const box = document.getElementById('tCalcResult');
      if (!from || !to) return alert('กรุณากรอกจุดเริ่มต้นและจุดหมายครับ');

      btn.innerText = 'กำลังคำนวณ...';
      try {
        const g1 = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(from)}`)).json();
        const g2 = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(to)}`)).json();
        if (!g1[0] || !g2[0]) throw new Error('หาพิกัดไม่พบ ลองพิมพ์เป็นภาษาอังกฤษ เช่น Vang Vieng');
        const r = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${g1[0].lon},${g1[0].lat};${g2[0].lon},${g2[0].lat}?overview=false`)).json();
        const km = (r.routes[0].distance / 1000).toFixed(1);
        const mins = Math.round(r.routes[0].duration / 60);
        const h = Math.floor(mins / 60), m = mins % 60;
        box.classList.remove('hidden');
        box.innerHTML = `🚗 ระยะทาง <strong>${km} กม.</strong> (ใช้เวลาขับรถประมาณ <strong>${h > 0 ? h + ' ชม. ' : ''}${m} นาที</strong>)`;
      } catch (e) {
        alert(e.message);
      } finally {
        btn.innerText = 'คำนวณระยะทาง & เวลาขับรถ';
      }
    }

    function resetAllData() {
      if (confirm('ต้องการล้างข้อมูลที่แก้ไขทั้งหมดและกลับเป็นแพลนเริ่มต้นใช่หรือไม่?')) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        closeToolModal(); renderApp(); saveState();
      }
    }

    function compressImage(file, cb, maxW = 700) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    init();
  </script>
</body>
</html>
