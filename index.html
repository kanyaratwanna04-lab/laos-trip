        <div class="min-w-0">
          <h1 id="headerTripTitle" onclick="editTripName()" class="font-bold text-slate-800 text-sm truncate cursor-pointer">

  <!-- Modal: เพิ่ม / แก้ไขแพลนเที่ยวใหม่ -->

        <button onclick="closePlanModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center">✕</button>

      <input type="hidden" id="editItemIdx" value="-1" />

          <select id="mIcon" class="border border-slate-200 rounded-xl px-2.5 py-2.5 text-base bg-white outline-none">

            <option value="🚐">🚐</option>

    // เสียงติ๊งแจ้งเตือนเบาๆ เวลาได้ข้อความใหม่
    function playPingSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    // ขออนุญาตแจ้งเตือนหน้าจอโทรศัพท์
    async function enableBrowserNotifications() {
      if (!('Notification' in window)) {
        return alert('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนครับ');
      }
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        playPingSound();
        new Notification('Sabai Laos 3D2N', {
          body: 'เปิดแจ้งเตือนแชทกลุ่มเรียบร้อยแล้ว!',
          icon: 'https://cdn-icons-png.flaticon.com/512/826/826070.png'
        });
        renderApp();
      } else {
        alert('กรุณากดอนุญาต (Allow) การแจ้งเตือนในการตั้งค่าเบราว์เซอร์ครับ');
      }
    }

    function triggerIncomingNotification(newState) {
      const oldMsgs = state.messages || [];
      const newMsgs = newState.messages || [];
      if (newMsgs.length > oldMsgs.length) {
        const lastMsg = newMsgs[newMsgs.length - 1];
        if (lastMsg.senderId !== activeUserId) {
          const sender = (newState.members || []).find(m => m.id === lastMsg.senderId);
          const senderName = sender ? sender.name : 'เพื่อนร่วมทริป';
          playPingSound();

          if (currentTab !== 'chat') {
            document.getElementById('chatUnreadDot').classList.remove('hidden');
          }

          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`${senderName} ส่งข้อความในทริปลาว`, {
              body: lastMsg.text,
              icon: 'https://cdn-icons-png.flaticon.com/512/826/826070.png'
            });
          }
        }
      }
    }

    async function init() {
      if (sb) {
        setSyncText('กำลังซิงก์...', false);
        const { data } = await sb.from('trip_plans').select('data').eq('id', TRIP_ID).single();
        if (data && data.data) {
          state = data.data;
        } else {
          await sb.from('trip_plans').upsert({ id: TRIP_ID, data: state });
        }
        setSyncText('ซิงก์เรียลไทม์', true);

        sb.channel('sabai-realtime-v2')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'trip_plans', filter: `id=eq.${TRIP_ID}` }, payload => {
            if (payload.new && payload.new.data) {
              triggerIncomingNotification(payload.new.data);
              state = payload.new.data;
              renderApp();
              setSyncText('อัปเดตล่าสุดแล้ว', true);
            }
          })
          .subscribe();
      } else {
        const saved = localStorage.getItem('sabai_mobile_v2_offline');
        if (saved) state = JSON.parse(saved);
        setSyncText('โหมดออฟไลน์ (ยังไม่ได้ใส่คีย์)', false);
      }
      renderApp();
    }

    function saveState() {
      clearTimeout(saveTimer);
      setSyncText('กำลังบันทึก...', false);
      saveTimer = setTimeout(async () => {
        if (sb) {
          await sb.from('trip_plans').upsert({ id: TRIP_ID, data: state, updated_at: new Date().toISOString() });

          localStorage.setItem('sabai_mobile_v2_offline', JSON.stringify(state));
          setSyncText('บันทึกในเครื่องแล้ว', false);
        }
      }, 300);
    }

    // ==================== TAB 2: ค่าใช้จ่าย ====================
    function renderExpenseTab() {
      const rate = Number(state.exchangeRate) || 650;
      let totalThb = 0;
      const catTotals = {};

      const memberStats = {};
      state.members.forEach(m => {
        memberStats[m.id] = { member: m, paid: 0, share: 0, net: 0 };
      });

      state.days.forEach(d => {
        d.items.forEach(item => {
          const raw = Number(item.cost) || 0;
          if (raw <= 0) return;
          const thb = item.currency === 'LAK' ? (raw / rate) : raw;
          totalThb += thb;
          catTotals[item.category] = (catTotals[item.category] || 0) + thb;

          const payerId = memberStats[item.payerId] ? item.payerId : state.members[0].id;
          memberStats[payerId].paid += thb;

          if (item.splitMode === 'shared') {
            const validSplitIds = (item.splitWith || []).filter(id => memberStats[id]);
            const targets = validSplitIds.length > 0 ? validSplitIds : state.members.map(m => m.id);
            const perHead = thb / targets.length;
            targets.forEach(uid => {
              memberStats[uid].share += perHead;
            });
          } else {
            memberStats[payerId].share += thb;
          }
        });
      });

      const debtors = [];
      const creditors = [];
      Object.values(memberStats).forEach(st => {
        st.net = st.paid - st.share;
        if (st.net < -0.5) debtors.push({ member: st.member, amount: Math.abs(st.net) });
        else if (st.net > 0.5) creditors.push({ member: st.member, amount: st.net });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);
      const settlements = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const payAmt = Math.min(debtors[i].amount, creditors[j].amount);
        if (payAmt >= 1) {
          settlements.push({ from: debtors[i].member, to: creditors[j].member, amount: Math.round(payAmt) });
        }
        debtors[i].amount -= payAmt;
        creditors[j].amount -= payAmt;
        if (debtors[i].amount < 0.5) i++;
        if (creditors[j].amount < 0.5) j++;
      }

      const totalLak = Math.round(totalThb * rate);
      const fundTotal = state.centralFund.reduce((s, f) => s + (Number(f.amount) || 0), 0);
      const fundRemaining = fundTotal - totalThb;
      const sortedCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);

            <div class="space-y-2">

    // ==================== TAB 4: แชทกลุ่ม (แก้ตัวเลือกผู้ส่ง + ปุ่มแจ้งเตือน) ====================
    function renderChatTab() {
      const me = getActiveUser();
      const notifSupported = ('Notification' in window);
      const notifGranted = notifSupported && Notification.permission === 'granted';

      return `
        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5">
            <span class="text-xl">💬</span>
            <div>
              <h2 class="font-bold text-sm text-slate-800">แชทกลุ่มทริปลาว</h2>
              <p class="text-[11px] text-slate-400">สมาชิก ${state.members.length}/10 คน</p>
            </div>
          </div>

          ${notifSupported ? (notifGranted ? `
            <span class="text-[11px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full font-medium">
              🔔 แจ้งเตือนเปิดอยู่
            </span>
          ` : `
            <button onclick="enableBrowserNotifications()" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-3 py-1.5 rounded-full font-semibold">
              🔔 เปิดแจ้งเตือน
            </button>
          `) : ''}
        </div>

        <div id="chatScrollBox" class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm h-[50vh] overflow-y-auto space-y-3">
          ${state.messages.map(msg => {
            const sender = state.members.find(m => m.id === msg.senderId) || state.members[0];
            const isMe = sender.id === me.id;
            return `
              <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                <span class="text-[10px] text-slate-400 mb-1 px-1">${sender.name} • ${msg.time}</span>
                <div class="flex items-end gap-2 max-w-[82%] ${isMe ? 'flex-row-reverse' : ''}">
                  <div class="w-7 h-7 rounded-full bg-orange-500 text-white text-xs flex items-center justify-center shrink-0 overflow-hidden">
                    ${sender.avatarUrl ? `<img src="${sender.avatarUrl}" class="w-full h-full object-cover" />` : (sender.emoji || sender.name.charAt(0))}
                  </div>
                  <div class="px-3.5 py-2.5 rounded-2xl text-xs leading-relaxed ${isMe ? 'bg-[#334155] text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm'}">
                    ${msg.text}
                  </div>
                </div>
              </div>
            `;
          }).join('')}

        <!-- กล่องพิมพ์ข้อความ + Dropdown เปลี่ยนชื่อผู้ส่งได้ทันที -->
        <div class="flex items-center gap-2">
          <select onchange="selectAsMe(this.value)" title="เลือกชื่อผู้ส่งแชท"
            class="bg-white border border-slate-200 rounded-2xl px-2 py-2.5 text-xs font-semibold text-slate-700 max-w-[115px] truncate outline-none">
            ${state.members.map(m => `

            `).join('')}
          </select>

          <input id="chatInput" type="text" placeholder="พิมพ์ข้อความในชื่อ ${me.name}..." onkeypress="if(event.key==='Enter') sendChat()"
            class="flex-1 bg-white border border-slate-200 rounded-2xl px-3.5 py-2.5 text-xs outline-none focus:border-[#334155]" />
          <button onclick="sendChat()" class="bg-[#334155] text-white w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 shadow-sm">
            ➤
          </button>
        </div>
      `;
    }

    // ==================== ACTIONS ====================
    function selectDay(idx) { state.activeDayIdx = idx; renderApp(); }
    function addNewDay() {
      const n = state.days.length + 1;
      state.days.push({ id: 'd' + Date.now(), label: `Day ${n}`, route: 'ระบุเส้นทางเดินทาง', items: [] });
      state.activeDayIdx = state.days.length - 1;
      renderApp(); saveState();
    }
    function editDayRoute() {
      const d = state.days[state.activeDayIdx];
      const r = prompt('แก้ไขเส้นทางของวันนี้:', d.route);
      if (r !== null) { d.route = r; renderApp(); saveState(); }
    }
    function editTripName() {
      const n = prompt('แก้ไขชื่อทริป:', state.tripName);
      if (n !== null && n.trim()) { state.tripName = n.trim(); renderApp(); saveState(); }
    }
    function toggleShowAllCats() { state.showAllCats = !state.showAllCats; renderApp(); }

    function setSplitMode(mode) {
      modalSplitMode = mode;
      const btnShared = document.getElementById('btnSplitShared');
      const btnPersonal = document.getElementById('btnSplitPersonal');
      const box = document.getElementById('splitMembersBox');
      if (mode === 'shared') {
        btnShared.className = 'py-2 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 bg-white border-[#334155] text-slate-800';
        btnShared.innerHTML = '<span>◉</span> หารกับเพื่อน';
        btnPersonal.className = 'py-2 px-3 rounded-xl border text-xs font-medium flex items-center justify-center gap-1.5 bg-white border-slate-200 text-slate-500';
        btnPersonal.innerHTML = '<span>○</span> ไม่หาร (ส่วนตัว)';
        box.classList.remove('hidden');
      } else {
        btnPersonal.className = 'py-2 px-3 rounded-xl border text-xs font-semibold flex items-center justify-center gap-1.5 bg-white border-[#334155] text-slate-800';
        btnPersonal.innerHTML = '<span>◉</span> ไม่หาร (ส่วนตัว)';
        btnShared.className = 'py-2 px-3 rounded-xl border text-xs font-medium flex items-center justify-center gap-1.5 bg-white border-slate-200 text-slate-500';
        btnShared.innerHTML = '<span>○</span> หารกับเพื่อน';
        box.classList.add('hidden');
      }
    }

    function openPlanModal(idx) {
      document.getElementById('editItemIdx').value = idx;
      const payerSel = document.getElementById('mPayerId');
      payerSel.innerHTML = state.members.map(m => `<option value="${m.id}">${m.emoji || '🐰'} ${m.name}</option>`).join('');

      let checkedIds = state.members.map(m => m.id);

      if (idx >= 0) {
        const item = state.days[state.activeDayIdx].items[idx];
        document.getElementById('modalTitle').innerText = 'แก้ไขแพลนเที่ยว';
        document.getElementById('mIcon').value = item.icon || '🏞️';
        document.getElementById('mTitle').value = item.title;
        document.getElementById('mTimeStart').value = item.timeStart || '08:30';
        document.getElementById('mTimeEnd').value = item.timeEnd || '10:00';
        document.getElementById('mTransport').value = item.transport || '🚐 รถตู้เหมา';
        document.getElementById('mMapQuery').value = item.mapQuery || '';
        document.getElementById('mBookingUrl').value = item.bookingUrl || '';
        document.getElementById('mCategory').value = item.category || '🍜 ค่าอาหาร';
        document.getElementById('mCost').value = item.cost || '';
        document.getElementById('mCurrency').value = item.currency || 'LAK';
        document.getElementById('mPayerId').value = item.payerId || state.members[0].id;
        document.getElementById('mNote').value = item.note || '';
        tempModalPhoto = item.photo || '';
        document.getElementById('mPhotoUrl').value = (item.photo && item.photo.startsWith('http')) ? item.photo : '';

        setSplitMode(item.splitMode || 'shared');
      } else {
        document.getElementById('modalTitle').innerText = 'เพิ่มแพลนเที่ยวใหม่';
        document.getElementById('mIcon').value = '🏞️';
        document.getElementById('mTitle').value = '';
        document.getElementById('mTimeStart').value = '09:00';
        document.getElementById('mTimeEnd').value = '10:30';
        document.getElementById('mTransport').value = '🚐 รถตู้เหมา';
        document.getElementById('mMapQuery').value = '';
        document.getElementById('mBookingUrl').value = '';
        document.getElementById('mCategory').value = '🍜 ค่าอาหาร';
        document.getElementById('mCost').value = '';
        document.getElementById('mCurrency').value = 'LAK';
        document.getElementById('mPayerId').value = getActiveUser().id;
        document.getElementById('mNote').value = '';
        tempModalPhoto = '';
        document.getElementById('mPhotoUrl').value = '';
        setSplitMode('shared');

          <span class="font-medium text-slate-700">${m.name}</span>
        </label>
      `).join('');

      document.getElementById('planModal').classList.remove('hidden');

    function closePlanModal() { document.getElementById('planModal').classList.add('hidden'); }

    function handleModalPhoto(input) {
      compressImage(input.files[0], url => {
        tempModalPhoto = url;
        document.getElementById('mPhotoUrl').value = '';
        updateModalPreview();
      });
    }
    function previewPhotoUrl(url) {
      tempModalPhoto = url.trim();
      updateModalPreview();
    }
    function clearModalPhoto() {
      tempModalPhoto = '';
      document.getElementById('mPhotoUrl').value = '';
      updateModalPreview();
    }
    function updateModalPreview() {
      const wrap = document.getElementById('mPhotoPreviewWrap');
      const img = document.getElementById('mPhotoPreview');
      if (tempModalPhoto) {
        img.src = tempModalPhoto;
        wrap.classList.remove('hidden');
      } else {
        wrap.classList.add('hidden');
      }
    }

    function savePlanItem() {
      const idx = Number(document.getElementById('editItemIdx').value);
      const title = document.getElementById('mTitle').value.trim();
      if (!title) return alert('กรุณากรอกชื่อสถานที่หรือกิจกรรมครับ');

      const selectedSplitIds = Array.from(document.querySelectorAll('.split-member-cb:checked')).map(cb => cb.value);
      if (modalSplitMode === 'shared' && selectedSplitIds.length === 0) {
        return alert('กรุณาเลือกผู้ร่วมหารบิลอย่างน้อย 1 คนครับ');
      }

      const obj = {
        id: 'i' + Date.now(),
        icon: document.getElementById('mIcon').value,
        title,
        timeStart: document.getElementById('mTimeStart').value || '09:00',
        timeEnd: document.getElementById('mTimeEnd').value || '10:00',
        transport: document.getElementById('mTransport').value,
        mapQuery: document.getElementById('mMapQuery').value.trim() || title,
        bookingUrl: document.getElementById('mBookingUrl').value.trim(),
        category: document.getElementById('mCategory').value,
        cost: Number(document.getElementById('mCost').value) || 0,
        currency: document.getElementById('mCurrency').value,
        payerId: document.getElementById('mPayerId').value,
        splitMode: modalSplitMode,
        splitWith: modalSplitMode === 'shared' ? selectedSplitIds : [document.getElementById('mPayerId').value],
        note: document.getElementById('mNote').value.trim(),
        photo: tempModalPhoto
      };

      if (idx >= 0) state.days[state.activeDayIdx].items[idx] = obj;
      else state.days[state.activeDayIdx].items.push(obj);

      closePlanModal();
      renderApp(); saveState();
    }

    function deletePlanItem(idx) {
      if (confirm('ลบรายการนี้ใช่หรือไม่?')) {
        state.days[state.activeDayIdx].items.splice(idx, 1);
        renderApp(); saveState();
      }
    }

    function updateRate(val) { state.exchangeRate = Math.max(1, Number(val) || 650); renderApp(); saveState(); }
    function addCentralFund() {
      const amt = prompt('ระบุจำนวนเงินที่ลงกองกลางเพิ่ม (บาท):', '1000');
      if (amt && !isNaN(amt)) {
        state.centralFund.push({ id: 'cf' + Date.now(), by: getActiveUser().name, amount: Number(amt), note: 'เพิ่มเงินกองกลาง' });
        renderApp(); saveState();
      }
    }

    function addMember() {
      if (state.members.length >= 10) return alert('ครบจำนวนสูงสุด 10 คนแล้วครับ');
      const name = document.getElementById('newMemberName').value.trim();
      const emoji = document.getElementById('newMemberEmoji').value;
      if (!name) return alert('กรุณาพิมพ์ชื่อเล่นเพื่อนก่อนครับ');
      const newId = 'm' + Date.now();
      state.members.push({ id: newId, name, role: 'สมาชิก', emoji, avatarUrl: '' });
      // ตั้งค่าให้คนที่กดเพิ่มชื่อตัวเอง กลายเป็นผู้ใช้งานในเครื่องนั้นทันที
      activeUserId = newId;
      localStorage.setItem('sabai_active_user', newId);
      renderApp(); saveState();
    }
    function removeMember(idx) {
      if (confirm('ลบสมาชิกคนนี้ออกจากทริปใช่หรือไม่?')) {
        state.members.splice(idx, 1);
        renderApp(); saveState();
      }
    }
    function selectAsMe(id) {
      activeUserId = id;
      localStorage.setItem('sabai_active_user', id);
      renderApp();
    }
    function uploadMemberAvatar(idx, input) {
      compressImage(input.files[0], url => { state.members[idx].avatarUrl = url; renderApp(); saveState(); }, 250);
    }
    function saveNoteText() {
      state.notes = document.getElementById('tripNoteInput').value;
      saveState();
      alert('บันทึกโน้ตเรียบร้อยแล้วครับ');
    }

    function sendChat() {
      const inp = document.getElementById('chatInput');
      const text = inp.value.trim();
      if (!text) return;
      const now = new Date();
      const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
      state.messages.push({ id: 'msg' + Date.now(), senderId: getActiveUser().id, text, time });
      inp.value = '';
      renderApp(); saveState();
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('คัดลอกลิงก์เว็บเรียบร้อยแล้ว! ส่งเข้ากลุ่มไลน์ให้เพื่อนเปิดใช้งานร่วมกันได้เลยครับ');
    }

    function openToolModal() { document.getElementById('toolModal').classList.remove('hidden'); }
    function closeToolModal() { document.getElementById('toolModal').classList.add('hidden'); }

    async function calcDistanceTool() {
      const from = document.getElementById('tFrom').value.trim();
      const to = document.getElementById('tTo').value.trim();
      const btn = document.getElementById('tCalcBtn');
      const box = document.getElementById('tCalcResult');
      if (!from || !to) return alert('กรุณากรอกจุดเริ่มต้นและจุดหมายครับ');

      btn.innerText = 'กำลังคำนวณ...';
      try {
        const g1 = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(from)}`)).json();
        const g2 = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(to)}`)).json();
        if (!g1[0] || !g2[0]) throw new Error('หาพิกัดไม่พบ ลองพิมพ์เป็นภาษาอังกฤษ เช่น Vang Vieng');
        const r = await (await fetch(`https://router.project-osrm.org/route/v1/driving/${g1[0].lon},${g1[0].lat};${g2[0].lon},${g2[0].lat}?overview=false`)).json();
        const km = (r.routes[0].distance / 1000).toFixed(1);
        const mins = Math.round(r.routes[0].duration / 60);
        const h = Math.floor(mins / 60), m = mins % 60;
        box.classList.remove('hidden');
        box.innerHTML = `🚗 ระยะทาง <strong>${km} กม.</strong> (ใช้เวลาขับรถประมาณ <strong>${h > 0 ? h + ' ชม. ' : ''}${m} นาที</strong>)`;
      } catch (e) {
        alert(e.message);
      } finally {
        btn.innerText = 'คำนวณระยะทาง & เวลาขับรถ';
      }
    }

    function resetAllData() {
      if (confirm('ต้องการล้างข้อมูลที่แก้ไขทั้งหมดและกลับเป็นแพลนเริ่มต้นใช่หรือไม่?')) {
        state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        closeToolModal(); renderApp(); saveState();
      }
    }

    function compressImage(file, cb, maxW = 700) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          cb(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    init();
  </script>
</body>
</html>
